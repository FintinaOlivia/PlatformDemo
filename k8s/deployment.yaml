apiVersion: apps/v1
kind: Deployment

metadata:
  name: platform-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: platform-demo

  template:
    metadata:
      labels:
        app: platform-demo

    spec:
      containers:

        - name: platform-demo

          # image: localhost:5000/platform-demo:latest
          image: localhost:5000/platform-demo:test

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 2
            periodSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi

---

apiVersion: v1
kind: Service

metadata:
  name: platform-demo

spec:
  selector:
    app: platform-demo

  ports:
    - port: 8080
      targetPort: 8080